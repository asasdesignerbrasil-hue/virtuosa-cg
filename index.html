<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtuosa CG | Moda Evangélica</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="src/img/favicon.png" type="image/png">
  <link rel="canonical" href="https://virtuosacg.store/">
  <meta name="description" content="Catálogo online da Virtuosa CG: moda evangélica, peças selecionadas e atendimento pelo WhatsApp.">
  <meta property="og:title" content="Virtuosa CG | Moda Evangélica">
  <meta property="og:description" content="Conheça o catálogo da Virtuosa CG e finalize seu pedido pelo WhatsApp.">
  <meta property="og:url" content="https://virtuosacg.store/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://virtuosacg.store/src/img/logo.png">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">
          <img src="src/img/logo.png" alt="Logo Virtuosa CG">
        </div>
        <div>
          <h1>Virtuosa CG</h1>
          <p class="tag">Moda Evangélica • Peças selecionadas • WhatsApp</p>
        </div>
      </div>
      <div class="actions">
        <a href="https://wa.me/5583987118599" class="btn btn-outline" target="_blank" rel="noopener">WhatsApp</a>
        <a href="#cart" class="btn btn-outline" id="btn-cart" aria-controls="cart" aria-expanded="false">Carrinho (<span id="cart-count">0</span>)</a>
        <a href="admin/" class="btn btn-primary" id="admin-login">Admin</a>
      </div>
    </div>
  </header>

  <div id="banner-aviso-wrap" class="banner-wrap" hidden>
    <div class="container">
      <p id="banner-aviso-text"></p>
    </div>
  </div>

  <main class="container">
    <section class="hero">
      <h2>Catálogo Virtuosa CG</h2>
      <p class="tag">Moda Evangélica • Elegância • Atendimento personalizado</p>
    </section>

    <section class="controls">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="vestidos">Vestidos</button>
        <button class="filter-btn" data-filter="saias">Saias</button>
        <button class="filter-btn" data-filter="blusas">Blusas</button>
        <button class="filter-btn" data-filter="conjuntos">Conjuntos</button>
        <button class="filter-btn" data-filter="acessorios">Acessórios</button>
        <button class="filter-btn" data-filter="promocoes">Promoções</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Buscar produto..." aria-label="Buscar produto">
      </div>
    </section>

    <section id="menu" class="menu-grid">
      <p>Carregando catálogo...</p>
    </section>

    <aside id="cart" class="cart-panel" aria-hidden="true">
      <button class="close-panel" aria-label="Fechar">×</button>
      <h3>Seu pedido</h3>
      <div id="cart-items"></div>
      <div class="cart-total">Total: <strong id="cart-total">R$ 0,00</strong></div>
      <form id="customer-form" class="customer-form-wrap">
        <h4>Seus dados</h4>
        <div class="form-grid">
          <div class="form-group">
            <label for="customer-name">Nome *</label>
            <input type="text" id="customer-name" placeholder="Seu nome completo" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="customer-phone">WhatsApp *</label>
            <input type="tel" id="customer-phone" placeholder="(83) 99999-9999" autocomplete="tel" required>
          </div>
          <div class="form-group">
            <label for="customer-address">Endereço (opcional)</label>
            <input type="text" id="customer-address" placeholder="Rua, número, bairro" autocomplete="street-address">
          </div>
        </div>
      </form>
      <div class="cart-actions">
        <a id="whatsapp-order" class="btn btn-primary" href="#">Finalizar pelo WhatsApp</a>
      </div>
    </aside>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Virtuosa CG • virtuosacg.store</p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
